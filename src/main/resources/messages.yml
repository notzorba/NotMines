# ─────────────────────────────────────────────────────────────────────────────
# NotMines messages
# MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html
#
# Keep placeholders such as <bet>, <player>, and <multiplier> intact. They are
# replaced safely by the plugin. Run /mines reload after editing this file.
# ─────────────────────────────────────────────────────────────────────────────

# Used for non-destructive default merging. Do not change this manually.
config-version: 1

# Available in every message as <prefix>.
prefix: "<#75C8FF><bold>MINES</bold></#75C8FF> <gray>▶</gray> <reset>"

general:
  players-only: "<prefix><gray>Only players can use that command.</gray>"
  no-permission: "<prefix><gray>You do <#FF5C72>not</#FF5C72> have permission to do that.</gray>"
  economy-missing: "<prefix><#FF5C72>Vault or a compatible economy provider is unavailable.</#FF5C72>"
  game-opening: "<prefix><gray>Opening a <white><mines>-mine</white> board for <#7DFFA8><bet></#7DFFA8>.</gray>"
  active-game-reminder: "<prefix><gray>You already have an active board. Use <aqua>/mines reopen</aqua> or <aqua>/mines cashout</aqua>.</gray>"
  board-closed: "<prefix><gray>Your board is still active. Use <aqua>/mines reopen</aqua> when you are ready.</gray>"
  stats-loading: "<prefix><gray>Loading mines stats...</gray>"

command:
  help:
    - ""
    - " <#75C8FF><bold>Mines Help</bold></#75C8FF>"
    - ""
    - " <gray><aqua>/mines <bet> <mines></aqua> <dark_gray>-</dark_gray> Start a new board.</gray>"
    - " <gray><aqua>/mines cashout</aqua> <dark_gray>-</dark_gray> Secure the current payout.</gray>"
    - " <gray><aqua>/mines reopen</aqua> <dark_gray>-</dark_gray> Reopen your active board.</gray>"
    - " <gray><aqua>/mines stats [player]</aqua> <dark_gray>-</dark_gray> View mines statistics.</gray>"
    - " <gray><aqua>/minestop</aqua> <dark_gray>-</dark_gray> Open the leaderboard.</gray>"
    - ""
    - " <dark_gray>Bets accept values such as 1k, 1.5m, and 2b.</dark_gray>"
    - ""
  help-admin:
    - " <#FFB347><bold>Admin</bold></#FFB347>"
    - " <gray><aqua>/mines limits</aqua> <dark_gray>-</dark_gray> View or update live limits.</gray>"
    - " <gray><aqua>/mines reload</aqua> <dark_gray>-</dark_gray> Reload all YAML files.</gray>"
    - ""
  invalid-bet-format: "<prefix><#FF5C72><value></#FF5C72> <gray>is not a valid bet. Try <white>1k</white>, <white>1.5m</white>, or <white>2b</white>.</gray>"
  invalid-mines-format: "<prefix><#FF5C72><value></#FF5C72> <gray>is not a valid mine count.</gray>"
  invalid-bet: "<prefix><gray>Your bet must be between <#FFB347><min></#FFB347> and <#FFB347><max></#FFB347>.</gray>"
  invalid-mines: "<prefix><gray>Choose between <#FFB347><min></#FFB347> and <#FFB347><max></#FFB347> mines.</gray>"
  cashout-empty: "<prefix><gray>You do not have an active board to cash out.</gray>"
  reopen-empty: "<prefix><gray>You do not have an active board to reopen.</gray>"
  already-started: "<prefix><gray>Finish or cash out your current board before starting another.</gray>"
  limits-usage:
    - "<prefix><gray>Use <aqua>/mines limits</aqua> to view the current limits.</gray>"
    - "<prefix><gray>Use <aqua>/mines limits <limit> <value></aqua> to update one.</gray>"
  limits-current:
    - ""
    - " <#75C8FF><bold>Live Mines Limits</bold></#75C8FF>"
    - ""
    - " <gray>Bet range: <#7DFFA8><min_bet></#7DFFA8> <dark_gray>—</dark_gray> <#7DFFA8><max_bet></#7DFFA8></gray>"
    - " <gray>Mine range: <white><min_mines></white> <dark_gray>—</dark_gray> <white><max_mines></white></gray>"
    - " <dark_gray>Money values accept k, m, and b suffixes.</dark_gray>"
    - ""
  limit-unknown: "<prefix><#FF5C72><limit></#FF5C72> <gray>is unknown. Use <white>min-bet</white>, <white>max-bet</white>, <white>min-mines</white>, or <white>max-mines</white>.</gray>"
  limit-updated: "<prefix><gray>Updated <white><limit></white> to <#7DFFA8><value></#7DFFA8>.</gray>"
  limit-too-high: "<prefix><gray><#FF5C72><limit></#FF5C72> cannot be higher than <white><other></white> (<white><value></white>).</gray>"
  limit-too-low: "<prefix><gray><#FF5C72><limit></#FF5C72> cannot be lower than <white><other></white> (<white><value></white>).</gray>"
  reload-success: "<prefix><gray>Reloaded <#7DFFA8>config.yml</#7DFFA8>, <#7DFFA8>messages.yml</#7DFFA8>, and <#7DFFA8>gui.yml</#7DFFA8>.</gray>"
  reload-failed: "<prefix><#FF5C72>Reload failed:</#FF5C72> <gray><reason></gray>"

economy:
  insufficient-funds: "<prefix><gray>You need <#FFB347><required></#FFB347> to start that board.</gray>"
  withdraw-failed: "<prefix><#FF5C72>Your bet could not be withdrawn. Please try again.</#FF5C72>"
  deposit-failed: "<prefix><#FF5C72>Your payout could not be completed automatically. Contact staff.</#FF5C72>"

game:
  hit-safe: "<prefix><#7DFFA8><bold>SAFE</bold></#7DFFA8> <gray>Multiplier: <white><multiplier>x</white> <dark_gray>•</dark_gray> Payout: <white><payout></white></gray>"
  hit-mine: "<prefix><#FF5C72><bold>BOOM!</bold></#FF5C72> <gray>You hit a mine and lost <white><bet></white>.</gray>"
  cashed-out: "<prefix><gray>Cashed out <#7DFFA8><payout></#7DFFA8> at <white><multiplier>x</white>.</gray>"
  board-cleared: "<prefix><#FFD166><bold>BOARD CLEARED!</bold></#FFD166> <gray>You won <white><payout></white> at <white><multiplier>x</white>.</gray>"
  forced-cashout: "<prefix><gray>Your active board closed safely and paid <#7DFFA8><payout></#7DFFA8>.</gray>"
  big-win: "<prefix><#FFD166><player></#FFD166> <gray>hit <white><multiplier>x</white> and won <#7DFFA8><payout></#7DFFA8> on a <white><mines>-mine</white> board!</gray>"

stats:
  header: "<prefix><#75C8FF><bold>Mines Stats</bold></#75C8FF> <dark_gray>•</dark_gray> <white><player></white>"
  body:
    - " <gray>Games: <white><games></white> <dark_gray>•</dark_gray> Wins: <white><wins></white> <dark_gray>•</dark_gray> Losses: <white><losses></white></gray>"
    - " <gray>Win rate: <white><win_rate>%</white> <dark_gray>•</dark_gray> Tiles cleared: <white><tiles></white></gray>"
    - " <gray>Total wagered: <white><wagered></white></gray>"
    - " <gray>Total paid: <white><paid_out></white></gray>"
    - " <gray>Net profit: <#7DFFA8><profit></#7DFFA8> <dark_gray>•</dark_gray> Best cashout: <white><best_cashout></white></gray>"
  missing: "<prefix><gray>No mines stats were found for <#FF5C72><player></#FF5C72>.</gray>"
